openapi: 3.0.3
info:
  title: Compass Quiz API
  version: 0.1.0
paths:
  /students:
    get:
      operationId: getStudents
      summary: List students for a facilitator
      parameters:
        - name: facilitator_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Student list and total count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentsResponse'
        '400':
          description: Missing or invalid facilitator ID
components:
  schemas:
    StudentsResponse:
      type: object
      required: [students, totalCount]
      properties:
        students:
          type: array
          items:
            $ref: '#/components/schemas/Student'
        totalCount:
          type: integer
    Student:
      type: object
      required: [id, name, loginId, classroom]
      properties:
        id:
          type: integer
          minimum: 1
          x-go-type: uint64
        name:
          type: string
        loginId:
          type: string
        classroom:
          $ref: '#/components/schemas/Classroom'
    Classroom:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          minimum: 1
          x-go-type: uint64
        name:
          type: string
