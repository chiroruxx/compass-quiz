version: "2"
run:
  build-tags:
    - integration
linters:
  default: all
  settings:
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - compass-quiz/api$
            - github.com/gin-gonic/gin$
            - github.com/go-sql-driver/mysql$
formatters:
  enable:
    - gofmt
