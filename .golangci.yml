version: "2"
linters:
  default: all
  disable:
    # The assignment includes Japanese names in example data.
    - gosmopolitan
  settings:
    testpackage:
      # Tests may use unexported handlers and router setup.
      skip-regexp: '_test\.go$'
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - compass-quiz/api$
            - github.com/gin-gonic/gin$
            - github.com/go-sql-driver/mysql$
formatters:
  enable:
    - gofmt
