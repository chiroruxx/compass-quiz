version: "2"
linters:
  default: all
  settings:
    testpackage:
      skip-regexp: '(export|internal|handler|route)_test\.go$'
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - compass-quiz/api$
            - github.com/gin-gonic/gin$
            - github.com/go-sql-driver/mysql$
formatters:
  enable:
    - gofmt
